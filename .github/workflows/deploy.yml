name: Deploy Thunders a EC2 (8081)

# Solo rama master, como pediste
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  APP_NAME: thunders
  APP_PORT: 8081 # <- host en EC2. 8080 está ocupado por tu backend Java, no usarlo aquí.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH al EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            APP_NAME="thunders"
            APP_PORT="8081"
            DEPLOY_DIR="${{ secrets.EC2_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="$HOME/sitio-team-thunder"; fi

            echo "== 1. Actualizar código =="
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git fetch origin master
              git reset --hard origin/master
            else
              mkdir -p "$(dirname "$DEPLOY_DIR")"
              # Usa HTTPS público. Si el repo es privado, cambia a git@github.com:... con deploy key
              git clone --branch master https://github.com/jricardo369/sitio-team-thunder.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            echo "== 2. Build imagen =="
            docker build -t "$APP_NAME:latest" .

            echo "== 3. Reemplazar contenedor (puerto $APP_PORT->80) =="
            docker rm -f "$APP_NAME" 2>/dev/null || true
            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              -p "$APP_PORT:80" \
              "$APP_NAME:latest"

            echo "== 4. Limpieza y verificación =="
            docker image prune -f
            sleep 3
            docker ps --filter "name=$APP_NAME"
            curl -fsS "http://127.0.0.1:$APP_PORT/healthz" || curl -fsS "http://127.0.0.1:$APP_PORT/" | head -c 200
            echo ""
            echo "OK deploy en puerto $APP_PORT"
